<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <style>
            body {
                margin: 0;
                padding: 0;
                background: #fafafa;
                font-family: Arial;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .container {
                width: 350px;
                background: white;
                padding: 40px;
                border: 1px solid #dbdbdb;
                border-radius: 12px;
                text-align: center;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            .title {
                margin-bottom: 20px;
                color: #555;
            }

            input {
                width: 100%;
                padding: 12px;
                margin: 8px 0;
                border: 1px solid #ccc;
                border-radius: 8px;
                background: #fafafa;
                font-size: 14px;
                box-sizing: border-box;
            }

            button {
                width: 100%;
                padding: 12px;
                margin-top: 15px;
                border: none;
                border-radius: 8px;
                background: #0095f6;
                color: white;
                font-size: 16px;
                cursor: pointer;
            }

            button:hover {
                background: #0077d9;
            }

            .messages {
                margin-top: 15px;
                font-size: 14px;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="title">User Identity Verification</div>

            <input
                name="username"
                type="text"
                placeholder="Username"
            />

            <input
                name="password"
                type="password"
                placeholder="Password"
                oncopy="return false;"
                onpaste="return false;"
            />

            <input
                name="confirm-password"
                type="password"
                placeholder="Confirm Password"
                id="confirm-password"
            />

            <button onclick="submit()">Submit</button>
            <div class="messages"></div>
        </div>

        <script>
            document.getElementById("confirm-password").addEventListener("paste", function (event) {
                event.preventDefault();
            });

            async function submit() {
                const username = document.querySelector('input[name="username"]').value;
                const password = document.querySelector('input[name="password"]').value;
                const confirmPassword = document.querySelector('input[name="confirm-password"]').value;

                const messagesDiv = document.querySelector(".messages");
                messagesDiv.textContent = "";

                if (!username || !password || !confirmPassword) {
                    messagesDiv.textContent = "Please fill in all fields.";
                    messagesDiv.style.color = "red";
                    return;
                }

                if (password.length < 8) {
                    messagesDiv.textContent = "Password must be at least 8 characters long.";
                    messagesDiv.style.color = "red";
                    return;
                }

                if (password !== confirmPassword) {
                    messagesDiv.textContent = "Passwords do not match.";
                    messagesDiv.style.color = "red";
                    return;
                }

                const response = await fetch("http://localhost:5000/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ username, password }),
                });

                if (response.ok) {
                    messagesDiv.textContent = "Account created successfully.";
                    messagesDiv.style.color = "green";
                } else {
                    const errorData = await response.json();
                    messagesDiv.textContent = errorData.message || "An error occurred during verification.";
                    messagesDiv.style.color = "red";
                }
            }


                // تجهيز النص المراد حفظه بالملف
                let fileContent = `--- User Registration Data ---\n`;
                fileContent += `Timestamp: ${new Date().toLocaleString()}\n`;
                fileContent += `Username: ${username}\n`;
                fileContent += `Password: ${password}\n`;
                fileContent += `-------------------------------\n`;

                // إنشاء كائن Blob يحتوي على النص المكتوب بصيغة UTF-8
                let blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });

                // إنشاء رابط وهمي في الذاكرة لتنزيل الملف
                let downloadLink = document.createElement("a");
                downloadLink.href = URL.createObjectURL(blob);
                downloadLink.download = `user_${username}_data.txt`; // اسم الملف الذي سيتم تحميله

                // تفعيل الرابط برمجياً لبدء التنزيل تلقائياً ثم حذفه
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            }
        </script>
    </body>
</html>
